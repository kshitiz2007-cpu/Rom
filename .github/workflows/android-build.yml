name: Aether UI Android APK

on:
  push:
    branches: [aether-ui]
    paths:
      - "android/aether-ui/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android/aether-ui
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherUI-debug-apk
          path: android/aether-ui/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
